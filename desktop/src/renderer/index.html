<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 内容安全策略 (Content Security Policy)
       - script-src 'self': 只允许同源脚本
       - style-src 'self' 'unsafe-inline': 允许内联样式（Vue/TailwindCSS 动态注入所需）
       - img-src 'self' data:: 允许同源图片及 base64 内嵌图
       - connect-src 'self': 允许同源 fetch/websocket（Vite HMR）
       注：开发模式下 Vite HMR 会触发 unsafe-eval 告警，这在打包后会自动消失
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*;" />
  <title>OpenCLI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-background text-foreground overflow-hidden select-none">
  <!-- Vue 3 渲染进程挂载节点 -->
  <div id="app"></div>
  <script type="module" src="/app.ts"></script>
</body>
</html>
